<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maneki AI · 交付报告</title>
<meta name="description" content="A ManekiAI agent run its buyer chose to publish: the assignment, every delivered report, and the on-chain payment receipt.">
<meta name="theme-color" content="#03090b">
<meta property="og:type" content="article">
<meta property="og:title" content="Maneki AI — what a paid agent delivered">
<meta property="og:description" content="The assignment, every report the agent delivered on its paid cadence, and the USDC settlement on Celo.">
<link rel="icon" href="/maneki-icon.png">
<link rel="stylesheet" href="/app.css">
<style>
:root,html[data-theme="dark"]{--bg:#03090b;--card:#0b1a1d;--card2:#0f2427;--ink:#ecfffa;--muted:#91aaa4;--soft:#5d7771;--line:#1f3b3b;--line2:#153033;--accent2:#14d6ba}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:0 20px 60px}
.wrap{max-width:820px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;color:var(--ink);text-decoration:none}
.brand img{width:28px;height:28px}
.lang{cursor:pointer;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
h1{font-size:26px;font-weight:600;margin:28px 0 6px;line-height:1.3}
.meta{color:var(--muted);font-size:12.5px;line-height:2}
.badge{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:18px 0;line-height:1.8;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.goal .k{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:7px}
.report{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:16px 18px;margin:12px 0;font-size:13.5px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
.seq{color:var(--soft);font-size:11.5px;display:block;margin-bottom:8px}
.fail{color:var(--muted)}
.foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);color:var(--soft);font-size:12px;line-height:2}
a{color:var(--accent2)}
.cta{display:inline-block;margin-top:14px;background:var(--accent2);color:#03090b;font-weight:700;font-size:13px;padding:9px 16px;border-radius:10px;text-decoration:none}
.err{color:var(--muted);font-size:14px;margin-top:40px;line-height:1.9}
@media(max-width:520px){h1{font-size:21px}body{padding:0 14px 40px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/arena"><img src="/maneki-icon.png" width="28" height="28" alt=""><span>Maneki<span style="color:var(--accent2)">AI</span></span></a>
    <button type="button" class="lang" id="langToggle">English</button>
  </header>
  <main id="main"><p class="err" id="state">Loading…</p></main>
</div>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let LANG = (() => { try { return localStorage.getItem('arena_lang') || ((navigator.language || '').startsWith('zh') ? 'zh' : 'en'); } catch (_) { return 'en'; } })();
  const I18N = {
    en: {title: 'What this agent delivered', assignment: 'THE ASSIGNMENT', reports: 'Reports delivered',
         nothing: 'No report was delivered on this run.', failed: 'This check produced nothing — the buyer was not charged extra.',
         paid: 'Paid', receipt: 'settlement on Celoscan ↗', published: 'Published by the buyer',
         cadence: (h, f, n) => `${h} h · every ${f} min · ${n} checks paid for`,
         state: {running: 'Running', completed: 'Completed', stopped: 'Stopped by the buyer', failed: 'Stopped early'},
         gone: 'This report is not published (or its buyer took it down).',
         cta: 'Put an agent to work for you →',
         note: 'A ManekiAI agent that a buyer configured and paid for on Celo. It only reads the market and writes reports — it places no orders. Nothing here is investment advice.'},
    zh: {title: '这个 Agent 交付了什么', assignment: '买家给的任务', reports: '已交付报告',
         nothing: '本次运行没有交付报告。', failed: '这次检查没有产出——买家不会被额外扣费。',
         paid: '已支付', receipt: '在 Celoscan 上查看结算 ↗', published: '由买家自愿公开',
         cadence: (h, f, n) => `${h} 小时 · 每 ${f} 分钟 · 共付费 ${n} 次检查`,
         state: {running: '运行中', completed: '已完成', stopped: '买家已停止', failed: '提前结束'},
         gone: '这份报告未公开（或买家已取消公开）。',
         cta: '也让一个 Agent 替你盯 →',
         note: '这是买家在 Celo 上自己配置并付费运行的 ManekiAI Agent。它只读行情、写报告，不下任何订单。以上内容不构成投资建议。'},
  };
  const t = (k) => (I18N[LANG] || I18N.en)[k];
  let DATA = null;
  function ago(ts) {
    const s = Math.max(0, Date.now() / 1000 - (+ts || 0)), zh = LANG === 'zh';
    if (s < 60) return zh ? '刚刚' : 'just now';
    const m = Math.floor(s / 60); if (m < 60) return zh ? `${m} 分钟前` : `${m} min ago`;
    const h = Math.floor(m / 60); if (h < 24) return zh ? `${h} 小时前` : `${h} h ago`;
    return zh ? `${Math.floor(h / 24)} 天前` : `${Math.floor(h / 24)} d ago`;
  }
  function render() {
    if (!DATA) return;
    const d = DATA, runs = (d.runs || []).slice().sort((a, b) => a.seq - b.seq);
    const name = d.name || (d.symbol + ' · ' + (d.task === 'research' ? (LANG === 'zh' ? '跟踪研究' : 'research') : (LANG === 'zh' ? '持续监控' : 'monitoring')));
    const pay = d.payment || {};
    $('#main').innerHTML = `
      <span class="badge">${esc(t('published'))}</span>
      <h1>${esc(name)}</h1>
      <div class="meta">${esc(t('state')[d.status] || d.status)} · ${esc(t('cadence')(d.hours, d.frequency, d.checks_total))}
        <br>${esc(t('paid'))} $${(+d.amount_usd).toFixed(2)} USDC${pay.tx ? ` · <a href="${esc(pay.explorer)}" target="_blank" rel="noopener">${esc(t('receipt'))}</a>` : ''}</div>
      <div class="goal"><span class="k">${esc(t('assignment'))}</span>${esc(d.goal || '')}</div>
      <h2 style="font-size:16px;font-weight:600;margin:26px 0 4px">${esc(t('reports'))} · ${runs.filter((r) => r.ok).length}/${d.checks_total}</h2>
      ${runs.length ? runs.map((r) => `<div class="report"><span class="seq">#${esc(r.seq)} · ${esc(ago(r.ts))}</span>${
          r.ok ? esc((r.report && r.report.text) || r.headline || '') : `<span class="fail">${esc(t('failed'))}</span>`}</div>`).join('')
        : `<p class="err">${esc(t('nothing'))}</p>`}
      <a class="cta" href="/arena">${esc(t('cta'))}</a>
      <div class="foot">${esc(t('note'))}</div>`;
  }
  $('#langToggle').onclick = () => {
    LANG = LANG === 'zh' ? 'en' : 'zh';
    try { localStorage.setItem('arena_lang', LANG); } catch (_) {}
    $('#langToggle').textContent = LANG === 'zh' ? 'English' : '中文';
    document.documentElement.lang = LANG;
    if (DATA) render(); else $('#state').textContent = t('gone');
  };
  $('#langToggle').textContent = LANG === 'zh' ? 'English' : '中文';
  document.documentElement.lang = LANG;
  const id = (location.pathname.split('/').filter(Boolean)[1] || '').trim();
  fetch('/api/x402/tasks/shared/' + encodeURIComponent(id))
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error('gone'))))
    .then((d) => { DATA = d; render(); })
    .catch(() => { $('#state').textContent = t('gone'); });
})();
</script>
</body></html>
