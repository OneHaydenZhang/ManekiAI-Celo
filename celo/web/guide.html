      jCpre: 'Needs: one finished journey B. The run receipt (task id + access token) lives in the browser you paid from; on another device — or after clearing site data — sign once with the wallet that paid to get it back.',
      jCs: ['Arena → “My records” → “My agents”: each card shows progress, the latest report and the payment receipt', 'More than one report? Click “All reports” to expand the history (newest check first)', 'New device / cleared cache: click “Restore with my wallet” → the wallet shows a plain-text signature (not a transaction, no gas) → the runs come back', 'Want it to end now: click “Stop” → the dialog states that the part which has not run is not refunded → confirm and the state becomes “Stopped”'],
      jCw: 'Observe: a running task refreshes itself once a minute; when the paid checks are used up the state becomes “Completed” and every report stays on the card (records are never deleted). The restore message carries a timestamp, is valid for 10 minutes, and only ever lists runs this wallet paid for.',
      jCgo: 'Open my records →',
      liveUpd: 'updated',
      liveRetry: 'Refresh data',
      liveFailWhy: 'The public data endpoint did not answer this time — most likely a network blip. Press “Refresh data” above; nothing is lost, the records live on the server.',
      liveEmpty: 'Nothing has settled yet. Do journey A ($0.02) or B and every row here fills in at once.',
      nowSettled: (n, p) => `${n} settled purchases · ${p} distinct paying wallets`,
      nowUsd: (u) => `$${u} moved`,
      nowReturning: (n) => `${n} wallets came back on another day`,
      nowTasks: (n, r, run) => `${n} agent runs paid for (${r} reports delivered, ${run} running)`,
      nowCelo: (n, u) => `${n} of them paid in CELO ($${u})`,
      nowDeposits: (n, s) => `${n} stablecoin top-ups from ${s} senders`,
      nowRate: (r) => `CELO quoted at $${r}`,
      samplesH: 'Delivered work (published by its buyer — open one and read what the agent wrote)',
      samplesNone: 'No buyer has published a report yet. After a run finishes, its buyer can press “Publish this report” in “My agents” and a row appears here for anyone to open.',
      bydayH: 'By day (last 14)', bydayNone: 'Nothing settled yet, so there is no daily shape to show.',
      thMarket: 'Market', thTask: 'Task', thReports: 'Reports', thOpen: 'Open', thOpenBtn: 'Read',
      thDay: 'Day', thCount: 'Purchases', thWallets: 'Wallets',
      liveSrc: 'Every number above is read from this server’s public endpoints — check them yourself, no login:', liveFail: 'Activity feed unavailable right now', kSettled: 'Settled purchases', kPayers: 'Distinct payers', kReturning: 'Returning payers', kUsd: 'USDC / USA₮ volume', kDeposits: 'Celo top-ups', kSenders: 'Top-up senders', kRegs: 'Agents registered',
      thWhen: 'When', thProduct: 'Product', thAmount: 'Amount', thPayer: 'Payer', thAgent: 'Agent', thTx: 'Tx', recentH: 'Most recent settlements', recentNone: 'No settlements yet. Run journey B once and the first row appears here.',
      prod: { insight: 'Agent insight (retired)', chat: 'Ask', brief: 'Symbol brief', task_monitor: 'Agent run · monitoring', task_research: 'Agent run · research' },
      regsH: 'On-chain registrations (ERC-8004)', thCode: 'Agent', thSymbol: 'Symbol', thId: 'Agent ID', thRegTx: 'Registration tx',
      regsNone: 'No agent registered on-chain yet. Agents are registered automatically by the registrar wallet after create/save (it needs a little CELO for gas); rows appear here within 30 s.',
      subStatus: 'Status: registration form submitted on 2026-09-13 (the values below are what was entered); final submission closes 2026-09-14 09:00 GMT, on-chain data keeps accruing.',
      subH: 'Field', subV: 'Value', sub: [
        ['Project', 'ManekiAI — AI trading agents that work for you, identified on Celo'],
        ['Public GitHub', K.repo],
        ['ERC-8004 Agent ID', `#${K.analystId} (platform Analyst · Identity Registry ${K.identity})`],
        ['Agent wallet address', `payTo (receives) ${K.payTo} · registrar (pays gas) ${K.registrar}`],
        ['Primary track', 'Real World Adoption'],
        ['Additional tracks, one line', 'Stablecoin Adoption — Gas top-ups in USDC/USD₮/USDm/USA₮ on Celo + every Arena purchase is an x402 settlement in USDC; Judges’ Favorite — ERC-8004 identity × x402 revenue share = agents that earn for their owners'],
        ['Distribution channel', 'Existing audience (manekiai.io users, X) + the public login-free Arena for the Celo community'],
        ['Demo', `${K.submittedDemo} (as entered) · guide ${K.submittedGuide}`],
        ['Telegram handle', 'submitted with the registration form (not published here)'],
      ],
      ago: (s) => (s < 60 ? 'just now' : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : `${Math.floor(s / 86400)} d ago`),
      left: (h, m) => `${h} h ${m} min`,
    },
  };
  let LANG = (() => { try { return localStorage.getItem('arena_lang') || ((navigator.language || '').startsWith('zh') ? 'zh' : 'en'); } catch (_) { return 'zh'; } })();
  // The host app keeps its own language key (default en). Seed it once so the
  // labels quoted in the journeys match what the reader sees after clicking
  // "Go to Agents"; never override a choice the reader already made there.
  try { if (!localStorage.getItem('vectora-lang')) localStorage.setItem('vectora-lang', LANG); } catch (_) {}
  const t = (k) => (I18N[LANG] && I18N[LANG][k] != null ? I18N[LANG][k] : I18N.zh[k]);
  let CFG = null, ACT = null, ENV = null, LOADED = false;
  const scanTx = (h) => `${K.scan}/tx/${h}`, scanAddr = (a) => `${K.scan}/address/${a}`;
  const short = (a) => (a && a.length > 12 ? a.slice(0, 6) + '…' + a.slice(-4) : a || '');
  const btn = (href, label, ghost) => `<a class="btn sm${ghost ? ' ghost' : ''}" href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`;
  const btnSame = (href, label, ghost) => `<a class="btn sm${ghost ? ' ghost' : ''}" href="${esc(href)}">${esc(label)}</a>`;
  const isPreview = () => !!(ENV && ENV.env === 'paper');

  function renderStatic() {
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
    $('#langToggle').textContent = LANG === 'zh' ? 'English' : '中文';
    document.title = t('h1');
    renderEnv();
    renderJourneys(); renderLive();
  }

  function renderEnv() {
    // Same signal the host app uses for its "preview box" strip (/api/version env=paper).
    const note = $('#envNote'), nav = $('#navApp');
    if (isPreview()) { note.hidden = false; note.textContent = t('envNote')(location.host); nav.textContent = t('navAppPreview')(location.host); }
    else { note.hidden = true; nav.textContent = t('navApp'); }
  }

  function renderJourneys() {
    // Each journey leads with what it costs, how long it takes and what it
    // needs — the three things someone decides on before reading the steps.
    const role = (k, go) => {
      const meta = t(k + 'meta') || [];
      return `<div class="role"><div class="hd"><b>${esc(t(k))}</b><div class="btns">${go}</div></div>
        ${meta.length ? `<div class="meta">${meta.map((m, i) => `<span${i === 0 ? ' class="cost"' : ''}>${esc(m)}</span>`).join('')}</div>` : ''}
        <p class="pre">${esc(t(k + 'pre'))}</p><ol>${t(k + 's').map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
        <div class="watch">👁 ${esc(t(k + 'w'))}</div></div>`;
    };
    $('#journeys').innerHTML =
      role('jA', btnSame('/arena', t('jAgo')) + btnSame('/arena', t('jAswap')) + btn(JUMPER, t('jAusdc'), true)) +
      role('jB', btnSame('/arena', t('jBgo')) + btnSame('/arena', t('jBswap')) + btn(JUMPER, t('jBusdc'), true)) +
      role('jC', btnSame('/arena#records', t('jCgo'))) +
      role('jD', btnSame('/arena', t('jDgo'))) +
      role('jE', btnSame('/arena', t('jEgo'))) +
      role('jF', btnSame('/arena#records', t('jFgo')));
  }

  function renderLive() {
    const meta = $('#liveMeta'), now = $('#liveNow');
    const blank = (id) => { const el = $(id); if (el) el.innerHTML = ''; };
    const btn = $('#liveRefresh');
    if (btn) {
      btn.textContent = t('liveRetry');
      btn.onclick = () => { btn.disabled = true; load(false).finally(() => { btn.disabled = false; }); };
    }
    if (!ACT) {
      // Loading and "the endpoint did not answer" must look different from
      // "nothing has happened yet" — otherwise a failure reads as no data.
      meta.textContent = LOADED ? t('liveFail') : t('stLoading');
      now.innerHTML = LOADED ? `<span class="err">${esc(t('liveFailWhy'))}</span>` : esc(t('stLoading'));
      ['#samples', '#recent', '#byday', '#regs'].forEach(blank);
      return;
    }
    const sm = ACT.summary || {}, dep = ACT.deposits || {}, regs = ACT.registrations || {};
    const tk = ACT.tasks || {}, cp = ACT.celo_pay || {};
    meta.textContent = `${t('liveUpd')} ${t('ago')(Math.max(0, Math.floor(Date.now() / 1000 - (+ACT.generated_at || 0))))}`;

    // One honest line instead of a wall of tiles: what has actually happened.
    const bits = [
      t('nowSettled')(+sm.settled || 0, +sm.payers || 0),
      t('nowUsd')((+sm.usd || 0).toFixed(2)),
      t('nowReturning')(+sm.returning_payers || 0),
      t('nowTasks')(+tk.tasks || 0, +tk.reports || 0, +tk.running || 0),
    ];
    if (+cp.orders > 0) bits.push(t('nowCelo')(+cp.orders, (+cp.usd || 0).toFixed(2)));
    if (+dep.count > 0) bits.push(t('nowDeposits')(+dep.count, +dep.senders || 0));
    if (+cp.rate_usd > 0) bits.push(t('nowRate')((+cp.rate_usd).toFixed(6)));
    now.textContent = (+sm.settled || 0) ? bits.join(' · ') : t('liveEmpty');

    // Delivered work someone chose to publish — the only thing on this page a
    // reader can open and judge for themselves.
    const sp = tk.samples || [];
    $('#samples').innerHTML = `<tr><th colspan="5">${esc(t('samplesH'))}</th></tr>` + (sp.length
      ? `<tr><th>${esc(t('thWhen'))}</th><th>${esc(t('thMarket'))}</th><th>${esc(t('thTask'))}</th><th>${esc(t('thReports'))}</th><th>${esc(t('thOpen'))}</th></tr>` +
        sp.map((x) => `<tr><td>${esc(t('ago')(Math.max(0, Math.floor(Date.now() / 1000 - (+x.shared_at || 0)))))}</td>
          <td>${esc(x.symbol || '')}</td><td>${esc((t('prod') || {})['task_' + x.task] || x.task || '')}</td>
          <td class="mono">${+x.reports || 0}</td>
          <td><a class="txlink" href="/r/${esc(x.share_id)}">${esc(t('thOpenBtn'))} ↗</a>${x.tx ? ` · <a class="txlink" target="_blank" rel="noopener" href="${esc(scanTx(x.tx))}">tx ↗</a>` : ''}</td></tr>`).join('')
      : `<tr><td class="tiny">${esc(t('samplesNone'))}</td></tr>`);

    const rec = ACT.recent || [];
    const prodLabel = (p) => ((t('prod') || {})[p]) || p || '—';
    $('#recent').innerHTML = `<tr><th colspan="6">${esc(t('recentH'))}</th></tr>` + (rec.length
      ? `<tr><th>${esc(t('thWhen'))}</th><th>${esc(t('thProduct'))}</th><th>${esc(t('thAmount'))}</th><th>${esc(t('thPayer'))}</th><th>${esc(t('thAgent'))}</th><th>${esc(t('thTx'))}</th></tr>` +
        rec.map((r) => `<tr><td>${esc(t('ago')(Math.max(0, Math.floor(Date.now() / 1000 - (+r.ts || 0)))))}</td><td>${esc(prodLabel(r.product))}</td><td>$${(+r.amount_usd || 0).toFixed(2)} ${esc(r.asset || 'USDC')}</td><td class="mono">${esc(r.payer_short || '—')}</td><td>${esc(r.agent_code || '—')}</td><td>${r.tx ? `<a class="txlink" target="_blank" rel="noopener" href="${esc(r.explorer || scanTx(r.tx))}">${esc(short(r.tx))} ↗</a>` : '—'}</td></tr>`).join('')
      : `<tr><td class="tiny">${esc(t('recentNone'))}</td></tr>`);

    // Adoption over time, the shape nobody can massage: one row per day.
    const days = (sm.by_day || []).slice(0, 14);
    $('#byday').innerHTML = `<tr><th colspan="4">${esc(t('bydayH'))}</th></tr>` + (days.length
      ? `<tr><th>${esc(t('thDay'))}</th><th>${esc(t('thCount'))}</th><th>${esc(t('thWallets'))}</th><th>${esc(t('thAmount'))}</th></tr>` +
        days.map((d) => `<tr><td class="mono">${esc(d.d)}</td><td class="mono">${+d.n || 0}</td><td class="mono">${+d.payers || 0}</td><td class="mono">$${(+d.usd || 0).toFixed(2)}</td></tr>`).join('')
      : `<tr><td class="tiny">${esc(t('bydayNone'))}</td></tr>`);

    const ra = regs.agents || [];
    $('#regs').innerHTML = `<tr><th colspan="4">${esc(t('regsH'))}${regs.platform ? ` · Analyst <a class="txlink" target="_blank" rel="noopener" href="${esc(regs.platform.explorer || scanTx(regs.platform.txhash))}">#${esc(regs.platform.agentId)} ↗</a>` : ''}</th></tr>` +
      (ra.length ? `<tr><th>${esc(t('thCode'))}</th><th>${esc(t('thSymbol'))}</th><th>${esc(t('thId'))}</th><th>${esc(t('thRegTx'))}</th></tr>` +
        ra.map((r) => `<tr><td>${esc(r.code)}</td><td>${esc(r.symbol || '')}</td><td>#${esc(r.celo_agent_id)}</td><td><a class="txlink" target="_blank" rel="noopener" href="${esc(r.explorer || scanTx(r.tx))}">${esc(short(r.tx))} ↗</a></td></tr>`).join('')
        : `<tr><td class="tiny" colspan="4">${esc(t('regsNone'))}</td></tr>`);

    // Say where every number came from, so it can be checked without us.
    const src = $('#liveSrc');
    if (src) src.innerHTML = t('liveSrc') + ' <a class="txlink" href="/api/x402/activity" target="_blank" rel="noopener">/api/x402/activity</a> · <a class="txlink" href="/api/x402/celo/health" target="_blank" rel="noopener">/api/x402/celo/health</a>';
  }

  async function getJson(url) { try { const r = await fetch(url, { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch (_) { return null; } }
  async function load(first) {
    const [cfg, act, ver] = await Promise.all([
      first ? getJson('/api/x402/config') : Promise.resolve(CFG), getJson('/api/x402/activity'),
      first ? getJson('/api/version') : Promise.resolve(ENV)]);
    if (cfg) CFG = cfg; if (act) ACT = act; if (ver) ENV = ver;
    LOADED = true;
    if (first && CFG && CFG.links && CFG.links.repo) $('#navRepo').href = CFG.links.repo;
    renderEnv(); renderLive();
  }
  $('#langToggle').onclick = () => { LANG = LANG === 'zh' ? 'en' : 'zh'; try { localStorage.setItem('arena_lang', LANG); localStorage.setItem('vectora-lang', LANG); } catch (_) {} renderStatic(); };
  renderStatic();
  load(true);
  setInterval(() => load(false), 30000);
})();
</script>
</body>
</html>
